<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <meta name="description" content="A simple to-do list: add, finish and delete tasks. Saved in your browser.">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>

    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="200" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="filter active" data-filter="all" aria-pressed="true">All <span class="count" id="count-all">0</span></button>
      <button type="button" class="filter" data-filter="active" aria-pressed="false">Active <span class="count" id="count-active">0</span></button>
      <button type="button" class="filter" data-filter="done" aria-pressed="false">Done <span class="count" id="count-done">0</span></button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty">No tasks yet. Add one above!</p>
    <div class="footer">
      <p id="counter" class="counter"></p>
      <button type="button" id="clear-done" class="clear-btn" hidden>Clear done</button>
    </div>
  </main>

  <script src="script.js?v=6"></script>
</body>
</html>
